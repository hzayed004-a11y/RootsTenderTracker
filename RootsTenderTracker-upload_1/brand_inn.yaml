# Brand -> INN bridge.
#
# WHY THIS FILE EXISTS
# The MOH Kuwait price list has no active-ingredient column, and originator
# products appear under brand names only: "Herceptin 440mg" is listed, but the
# string "trastuzumab" appears nowhere in the file. Searching the price list by
# molecule therefore misses every originator unless the brand is known.
#
# This bridge is consulted in both directions: a tender line naming a molecule
# also searches its brands, and a tender line naming a brand also searches the
# molecule. Matches found this way are tagged method "brand" so they can be
# audited separately from direct hits.
#
# Add your own entries freely -- format is  brand: inn
# Lowercase both sides. One brand per line; a molecule may repeat.

